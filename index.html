<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talabat Script Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h2>Talabat Script Library</h2>
    <input type="text" id="searchInput" placeholder="🔍 Search scripts or categories..." />
  </header>

  <!-- Navigation Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="approved">Approved Scripts</button>
    <button class="tab-btn" data-tab="personal">Personal Scripts</button>
  </nav>

  <!-- Category Filter -->
  <div class="category-filter">
    <select id="categorySelect">
      <option value="all">All Categories</option>
      <option value="Delivery">Delivery Issues</option>
      <option value="Refund">Refunds & Payments</option>
      <option value="Order">Order Modifications</option>
      <option value="General">General / Greetings</option>
    </select>
  </div>

  <!-- Main Content Container -->
  <main id="scriptContainer">
    <!-- Script cards will render dynamically via JS -->
  </main>

  <!-- Add Personal Script Section -->
  <section class="add-script-section">
    <h3>+ Add Personal Script</h3>
    <input type="text" id="newTitle" placeholder="Script Title (e.g., My Greeting)" />
    <select id="newCategory">
      <option value="General">General / Greetings</option>
      <option value="Delivery">Delivery Issues</option>
      <option value="Refund">Refunds & Payments</option>
      <option value="Order">Order Modifications</option>
    </select>
    <textarea id="newBody" rows="3" placeholder="Enter script text here... Use [Customer Name] or [Order ID] for placeholders."></textarea>
    <button id="addScriptBtn">Save Personal Script</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
